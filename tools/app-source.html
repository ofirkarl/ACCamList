<title>AC Cam List</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one narrow working column, like an AC's clipboard; productions -> a production with three tabs (Add gear / Favorites / Gear list); camera-tape colors tag catalog categories */
:root {
  --bg: #e7eaee;
  --surface: #ffffff;
  --sunken: #f5f6f8;
  --fg: #15181d;
  --muted: #5a6270;
  --line: #d3d8df;
  /* framed boxes sit a little above the page */
  --frame-shadow: 0 1px 2px rgba(20, 28, 40, .07), 0 0 0 1px rgba(20, 28, 40, .015);
  --accent: #1d4f7a;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --ok: #2f7a4f;
  --mark: #fde68a;
  --tape-camera: #c8392f;
  --tape-lenses: #d99b00;
  --tape-camera_accessories: #2c6fb3;
  --tape-filters: #7a4fb3;
  --tape-custom: #5f6b7a;
  --warn: #9a5b00;
  --warn-bg: #fff4e0;
  --star: #d08a00;
  --desk: #c9ced6;
  --paper: #ffffff;
  /* category color palette (the four rental house categories start on red, amber, blue and violet) */
  --pal-red: #c8392f; --pal-orange: #d0661f; --pal-amber: #d99b00; --pal-olive: #7f8a1f; --pal-green: #3f8a3a; --pal-teal: #2f8a83;
  --pal-sky: #2a8fc0; --pal-blue: #2c6fb3; --pal-indigo: #4a5fc1; --pal-violet: #7a4fb3; --pal-pink: #c0447e; --pal-slate: #5f6b7a;
  /* gear list sections: the camera, lens, filter and accessory sections reuse their category's tape */
  --sec-camera: var(--tape-camera); --sec-lens: var(--tape-lenses); --sec-filters: var(--tape-filters); --sec-accessories: var(--tape-camera_accessories); --sec-custom: var(--tape-custom);
  --sec-support: #2f8a83; --sec-display: #4a5fc1; --sec-media: #3f8a3a; --sec-power: #c7631f; --sec-grip: #8a6a45; --sec-aks: #6b7380;
  /* how strongly the tape color tints a heading, and how dark every other row is */
  --tint-a: 9%; --tint-b: 6%; --zebra-a: 3.2%;
  --zebra: color-mix(in srgb, var(--fg) var(--zebra-a), var(--surface));
  --picked: color-mix(in srgb, var(--accent) 10%, var(--surface));
  --hair: color-mix(in srgb, var(--line) 72%, var(--surface));
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12; --surface: #1d2027; --sunken: #16191e; --fg: #e8eaee; --muted: #9aa2af; --line: #30353f; --frame-shadow: 0 1px 2px rgba(0, 0, 0, .4);
    --accent: #7fb2e0; --accent-fg: #0e1a26; --danger: #ef8a83; --ok: #6cc795; --mark: #6b5a12;
    --tape-camera: #e0645a; --tape-lenses: #f0c040; --tape-camera_accessories: #5b9be0; --tape-filters: #a98be0; --tape-custom: #8e9aab; --warn: #f0b060; --warn-bg: #33270f; --star: #f0c040; --desk: #2a2e35; --paper: #ffffff;
    --pal-red: #e0645a; --pal-orange: #f0935a; --pal-amber: #f0c040; --pal-olive: #c2cc5a; --pal-green: #79c26f; --pal-teal: #5fc0b8; --pal-sky: #6cc4ec; --pal-blue: #5b9be0; --pal-indigo: #8796ec; --pal-violet: #a98be0; --pal-pink: #ec86b6; --pal-slate: #8e9aab;
    --sec-support: #5fc0b8; --sec-display: #8796ec; --sec-media: #79c26f; --sec-power: #f0935a; --sec-grip: #c49a6c; --sec-aks: #9aa2af; --tint-a: 12%; --tint-b: 7.5%; --zebra-a: 3.8%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f12; --surface: #1d2027; --sunken: #16191e; --fg: #e8eaee; --muted: #9aa2af; --line: #30353f; --frame-shadow: 0 1px 2px rgba(0, 0, 0, .4);
  --accent: #7fb2e0; --accent-fg: #0e1a26; --danger: #ef8a83; --ok: #6cc795; --mark: #6b5a12;
  --tape-camera: #e0645a; --tape-lenses: #f0c040; --tape-camera_accessories: #5b9be0; --tape-filters: #a98be0; --tape-custom: #8e9aab; --warn: #f0b060; --warn-bg: #33270f; --star: #f0c040; --desk: #2a2e35; --paper: #ffffff;
    --pal-red: #e0645a; --pal-orange: #f0935a; --pal-amber: #f0c040; --pal-olive: #c2cc5a; --pal-green: #79c26f; --pal-teal: #5fc0b8; --pal-sky: #6cc4ec; --pal-blue: #5b9be0; --pal-indigo: #8796ec; --pal-violet: #a98be0; --pal-pink: #ec86b6; --pal-slate: #8e9aab;
    --sec-support: #5fc0b8; --sec-display: #8796ec; --sec-media: #79c26f; --sec-power: #f0935a; --sec-grip: #c49a6c; --sec-aks: #9aa2af; --tint-a: 12%; --tint-b: 7.5%; --zebra-a: 3.8%;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app { max-width: 760px; margin: 0 auto; padding-bottom: 96px; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.topbar { padding-block: 18px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brandmark { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; white-space: nowrap; }
.brandmark span { color: var(--muted); font-weight: 700; }
.save-state { font-size: 12px; color: var(--muted); text-align: end; line-height: 1.25; }
.top-right { display: flex; align-items: center; gap: 6px; align-self: center; }
.theme-btn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); box-shadow: var(--frame-shadow); }
.theme-btn:hover { color: var(--accent); }
.save-state.saving::before, .save-state.saved::before { content: "● "; }
.save-state.saved::before { color: var(--ok); }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; padding-inline: 8px; color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: default; }

/* home */
.home-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-block: 18px 12px; }
.home-head .btn { white-space: nowrap; }
h2.page { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; margin: 0; text-transform: uppercase; text-wrap: balance; }
.prod-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.prod-card { width: 100%; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.prod-card b { font-size: 17px; font-weight: 600; }
.prod-card .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty-state { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 28px 20px; display: grid; gap: 10px; justify-items: start; }
.empty-state h3 { margin: 0; font-size: 18px; }
.empty-state p { margin: 0; color: var(--muted); max-width: 52ch; }

/* form */
.form { display: grid; gap: 14px; padding-block: 8px 24px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.field input, .field textarea, .field select { width: 100%; box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.row3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.house-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.house-opt { display: grid; gap: 2px; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.house-opt b { font-weight: 600; }
.house-opt span { font-size: 12px; color: var(--muted); }
.house-opt[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.house-opt[disabled] { opacity: .55; cursor: not-allowed; }
.hint { font-size: 12px; color: var(--muted); }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.form-actions .grow { display: flex; gap: 8px; }

/* production header */
.prod-head { padding-block: 10px 6px; display: grid; gap: 6px; }
.prod-head .back { justify-self: start; }
.prod-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.prod-title h2 { font-family: var(--font-display); font-weight: 800; font-size: 36px; line-height: 1; margin: 0; text-transform: uppercase; overflow-wrap: anywhere; }
.prod-meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.prod-tools { display: flex; gap: 6px; flex-wrap: wrap; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--line); padding: 4px; border-radius: 10px; margin-block: 8px 4px; }
.tab { border: 0; background: transparent; border-radius: 7px; padding: 9px 10px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.tab .num { font-size: 12px; margin-inline-start: 4px; }

/* catalog bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 11px 0; outline: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; }
.chip .dot { width: 10px; height: 10px; border-radius: 2px; background: var(--tape, var(--muted)); }
.chip .num { font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] .num { color: inherit; opacity: .7; }

/* catalog tree */
summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
summary::-webkit-details-marker { display: none; }
.sumr { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.cnt { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.sel { font-family: var(--font-mono); font-size: 11px; background: var(--accent); color: var(--accent-fg); border-radius: 999px; padding: 1px 7px; }
.chev { transition: transform .15s; color: var(--muted); }
details[open] > summary .chev { transform: rotate(180deg); }
.cat { border-bottom: 1px solid var(--line); }
.cat > summary { padding-block: 14px; }
.cat-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; text-transform: uppercase; }
.tape { display: inline-block; width: 28px; height: 13px; background: var(--tape); border-radius: 2px; transform: rotate(-2deg); flex: none; }
.cat-body { display: grid; gap: 10px; padding-bottom: 16px; }
.sub { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sub > summary { padding: 12px 14px; font-weight: 600; }
.sub > summary small { font-weight: 400; color: var(--muted); font-size: 12px; }
.brand { border-top: 1px solid var(--line); }
.brand > summary { padding: 10px 14px 10px 24px; font-size: 14px; }
.bname { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.bname::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tape); flex: none; }
.items { list-style: none; margin: 0; padding: 0; background: var(--sunken); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px 8px 38px; border-top: 1px solid var(--line); min-width: 0; }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.item.on .nm { font-weight: 600; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

/* qty controls */
.add { flex: none; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 13px; }
.stepper { flex: none; display: inline-flex; align-items: center; border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 32px; height: 32px; font-size: 18px; line-height: 1; color: var(--accent); }
.stepper input { width: 40px; height: 32px; border: 0; border-inline: 1px solid var(--line); text-align: center; background: transparent; font-family: var(--font-mono); font-size: 14px; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* gear list */
.list-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-block: 12px 4px; }
.list-tools .grp { display: flex; gap: 6px; flex-wrap: wrap; }
.summary-line { color: var(--muted); font-size: 13px; }
.section { padding-block: 14px 4px; display: grid; gap: 8px; }
.section h3 { margin: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1; }
.section h3 .cnt { font-family: var(--font-mono); }
.lines { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.line { display: grid; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); min-width: 0; }
.l-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; }
.l-top .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; padding-top: 5px; }
.l-top .note { font-weight: 400; color: var(--muted); }
.l-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-width: 0; }
.l-meta .specs { display: contents; }
.l-bottom { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.l-bottom .auto { font-size: 12px; color: var(--muted); }
.line:first-child { border-top: 0; }
.line .nm { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.line .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.line .more { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; }
.line .more input { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--sunken); font-size: 13px; }
.line .more select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--sunken); font-size: 13px; max-width: 100%; }
.x { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 6px; font-size: 18px; }
.x:hover { color: var(--danger); }
.section-empty { color: var(--muted); font-size: 13px; padding: 2px 2px 0; }
.custom-add { display: flex; gap: 6px; flex-wrap: wrap; }
.custom-add input { flex: 1 1 180px; min-width: 0; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; background: transparent; font-size: 14px; }
.custom-add button { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 8px 12px; font-size: 14px; color: var(--accent); }

/* floating summary on Add gear */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-top: 12px; background: var(--surface); border-top: 1px solid var(--line); }
.dock-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-sizing: border-box; }
.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 40; max-width: calc(100% - 32px); }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.copybox { width: 100%; box-sizing: border-box; min-height: 160px; font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface); }

/* v3: stars, specs, TX/RX, editor, warnings, settings */
.star { flex: none; border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; color: var(--muted); font-size: 18px; line-height: 1; padding: 0; }
.star[aria-pressed="true"] { color: var(--star); }
.item { padding-left: 24px; }
.item .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.specs { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; }
.cov { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg); }
.ctl { flex: none; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.item.has-txrx { flex-wrap: wrap; }
.item.has-txrx .ctl { flex-basis: 100%; }
.tr { display: inline-flex; align-items: center; gap: 4px; }
.tr > span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.stepper.sm button { width: 28px; height: 28px; font-size: 16px; }
.stepper.sm input { width: 32px; height: 28px; font-size: 13px; }
.line .qtys { display: flex; gap: 12px; flex-wrap: wrap; }
.line .kids { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.line .tools { display: flex; align-items: center; gap: 0; flex: none; margin-top: -2px; }
.iconbtn { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 6px; font-size: 15px; }
.iconbtn:hover { color: var(--accent); }
.editor { display: grid; gap: 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.editor .field input, .editor .field select { background: var(--surface); }
.children { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.child { display: flex; gap: 6px; align-items: center; }
.child input[type="text"] { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); font-size: 13px; }
.editor-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.warnbox { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; margin-top: 10px; }
.warnbox b { color: var(--warn); }
.warnbox p { margin: 0; font-size: 14px; }
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(10, 12, 16, .5); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
.modal-card { background: var(--surface); color: var(--fg); border-radius: 14px; max-width: 520px; width: 100%; box-sizing: border-box; padding: 18px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.modal-card h3 { margin: 0; font-size: 18px; color: var(--warn); }
.modal-card p { margin: 0; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (min-width: 600px) { .modal { align-items: center; } }
.rules { display: grid; gap: 8px; }

  padding-top: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* editing: catalog edit mode, drag handles, rename buttons, drop targets */

.section h3 > span:first-child { display: inline-flex; align-items: center; gap: 2px; min-width: 0; }
.handle { flex: none; border: 0; background: transparent; color: var(--muted); width: 28px; height: 32px; margin-inline-start: -6px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.tag { font-size: 11px; border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; color: var(--accent); }
.sku { font-family: var(--font-mono); font-size: 11px; color: var(--fg); background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; letter-spacing: .02em; }
.add-head { display: block; width: 100%; text-align: start; border: 1px dashed var(--line); background: transparent; color: var(--accent); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; }

.sub-title { display: inline-flex; align-items: center; gap: 4px; min-width: 0; }

details.drop-before { box-shadow: inset 0 3px 0 var(--accent); }

.bname { min-width: 0; }

.is-dragging .dock, .is-dragging .toast { visibility: hidden; }
.items.direct { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.add-row { display: flex; gap: 8px; flex-wrap: wrap; }

.field[hidden] { display: none; }
.nm-btn { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: start; cursor: pointer; }
.nm-btn:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.inote { justify-self: start; font-size: 12.5px; line-height: 1.35; color: var(--fg); background: var(--warn-bg); border-inline-start: 3px solid var(--star); border-radius: 4px; padding: 3px 8px; margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
.nm-row { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.nm-row .nm { min-width: 0; }
.ext { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin: -4px 0; border-radius: 6px; color: var(--muted); vertical-align: middle; }
.ext:hover, .ext:focus-visible { color: var(--accent); background: var(--sunken); }
.l-top .nm .ext { margin-inline-start: 4px; }
details.sub.drop-on, details.brand.drop-on { outline-offset: -2px; }
.add-row.inset { margin: 8px 14px 12px; }
.add-row.inset .add-head { font-size: 13px; padding: 8px 12px; }
li.drop-empty { list-style: none; }
.mfr-head { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 14px 4px 24px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
.mfr-head + .item { border-top: 0; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.mfr-head > span:first-child { display: inline-flex; align-items: center; gap: 2px; }

.mfr-head.drop-on { outline: 2px solid var(--accent); outline-offset: -2px; }
.pick-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pick-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); }
.pick-list li:first-child { border-top: 0; }
.pick-list .info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.items.flat > .mfr-head:first-child { border-top: 0; }
.sub > .items.flat { border-top: 1px solid var(--line); }
.mfr-head .handle { width: 24px; height: 24px; margin-inline-start: -8px; }
.mfr-head.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.mfr-head.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.mfr-head { cursor: pointer; -webkit-user-select: none; user-select: none; }
.mfr-head .mfr-name { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.mfr-head .sumr { display: inline-flex; align-items: center; gap: 6px; }
.mfr-head .chev { width: 12px; height: 12px; }
.mfr-head:not(.closed) .chev { transform: rotate(180deg); }
.mfr-head.closed { color: var(--muted); }
.item.edit { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.is-dragging .chip { outline: 1px dashed var(--accent); outline-offset: 1px; }
.drop-zone { margin: 0 0 8px; padding: 18px 14px; border: 2px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; }
.drop-zone.drop-on { border-color: var(--accent); color: var(--accent); }
details.cat.drop-on { outline: none; background: transparent; }
details.cat.drop-on > summary { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
.sub > .items.loose { border-top: 1px solid var(--line); }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; max-width: min(70vw, 420px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }
.is-dragging, .is-dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
.dragging { opacity: .35; }
.drop-on { outline: 2px solid var(--accent); outline-offset: -2px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.section.drop-on { outline-offset: 2px; border-radius: 10px; background: transparent; }
.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.drop-empty { margin: 0; padding: 12px 14px; color: var(--muted); font-size: 13px; border-top: 1px dashed var(--line); }
.modal-card h3.plain { color: var(--fg); }
.modal-card { max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
.form.dialog { padding: 0; gap: 12px; }
.modal-actions .grow { flex: 1; }
/* color: each category's tape color, carried faintly down to its subcategories, folders, manufacturer headings and SKUs; every other row shaded */
.cat, .section, .fav-cat, .finder {
  --tint: color-mix(in srgb, var(--tape) var(--tint-a), var(--surface));
  --tint-soft: color-mix(in srgb, var(--tape) var(--tint-b), var(--surface));
  --ink: color-mix(in srgb, var(--tape) 62%, var(--fg));
  --tline: color-mix(in srgb, var(--tape) 30%, var(--line));
}
.items { background: var(--surface); }
.item, .line { border-top-color: var(--hair); }
.sub { border-color: var(--tline); }
.sub > summary { background: var(--tint); }
.sub > .items.flat, .sub > .items.loose, .brand, .items.direct, .fav-cat .fav-list, .section .lines { border-color: var(--tline); }
.brand > summary { background: var(--tint-soft); }
.bname { color: var(--ink); }
.mfr-head { background: var(--tint-soft); color: var(--ink); border-top-color: var(--tline); }
.mfr-head.closed { background: var(--surface); color: var(--muted); }
.cat .sku, .fav-cat .sku, .section .sku { background: var(--tint); border-color: var(--tline); color: var(--ink); }
.fav-group { gap: 10px; }
.fav-cat { display: grid; gap: 6px; }
.fav-cat-h { margin: 4px 0 0; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.fav-cat-h .cnt { margin-inline-start: auto; font-weight: 500; letter-spacing: 0; }
.fav-cat-h .tape, .section h3 .tape { width: 22px; height: 10px; }
.section h3 .tape { margin-inline-end: 8px; }
.fav-head { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 9px 14px 4px; background: var(--tint-soft); color: var(--ink); border-top: 1px solid var(--tline); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.fav-list > .fav-head:first-child { border-top: 0; }
.fav-head + .item { border-top: 0; }
.item.alt, .line.alt { background: var(--zebra); }
.item.on { background: var(--picked); box-shadow: inset 3px 0 0 var(--accent); }
.sub > summary.drop-on, .brand > summary.drop-on, .mfr-head.drop-on, .item.drop-on { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { position: relative; width: 32px; height: 32px; border-radius: 8px; background: var(--sw); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 15%, transparent); cursor: pointer; flex: none; }
.sw input[type="radio"] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw:has(input[type="radio"]:checked) { outline: 2px solid var(--fg); outline-offset: 2px; }
.sw:has(input[type="radio"]:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw-orig { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--surface); pointer-events: none; }
.sw-any { background: conic-gradient(from 90deg, #e0645a, #f0c040, #79c26f, #5fc0b8, #5b9be0, #a98be0, #ec86b6, #e0645a); }
.sw-any:has(input[type="radio"]:checked) { background: var(--sw); }
.sw-any input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; }
/* advanced search: lens finder */
.search-row { display: flex; gap: 8px; align-items: stretch; }
.bar { grid-template-columns: minmax(0, 1fr); }
.search-row .search { flex: 1; min-width: 0; }
.spec-btn { flex: none; border-radius: 10px; padding: 0 12px; gap: 6px; font-size: 14px; white-space: nowrap; }
.spec-btn svg { color: var(--accent); }
.f-banner { display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; text-align: start; margin: 14px 0 2px; padding: 12px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); color: var(--fg); font-size: 13px; }
.f-banner > span:nth-child(2) { flex: 1; min-width: 0; color: var(--muted); }
.f-banner b { display: block; font-family: var(--font-mono); font-size: 16px; color: var(--fg); }
.f-banner svg, .f-banner > span:last-child { color: var(--accent); flex: none; }
.finder { display: grid; gap: 14px; padding-top: 14px; padding-bottom: 28px; }
.finder, .f-res { grid-template-columns: minmax(0, 1fr); }
.finder > *, .f-res > * { min-width: 0; }
.f-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.f-title { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; }
.f-head .hint { margin: 6px 0 0; max-width: 46ch; }
.f-form { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--tline); border-radius: 12px; padding: 12px; }
.f-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.f-field { display: grid; gap: 4px; min-width: 0; }
.f-field > span:first-child { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.f-inp { display: flex; align-items: baseline; gap: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); padding: 0 12px; min-width: 0; }
.f-inp:focus-within { border-color: var(--accent); background: var(--surface); }
.f-inp input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; padding: 9px 0; font-family: var(--font-mono); font-size: 22px; font-weight: 500; outline: none; }
.f-inp i { font-style: normal; color: var(--muted); font-family: var(--font-mono); font-size: 15px; }
.f-field select { width: 100%; min-width: 0; box-sizing: border-box; border: 1px solid var(--line); border-radius: 8px; background: var(--sunken); padding: 10px 10px; font-size: 15px; }
.f-field select:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.f-res { display: grid; gap: 10px; }
.f-sum { margin: 0; font-size: 13px; color: var(--muted); }
.f-sum b { color: var(--fg); font-family: var(--font-mono); }
.f-ruler-wrap { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); }
.f-ruler-wrap::before { content: ""; position: absolute; left: 50%; top: 0; transform: translateX(-50%); border: 7px solid transparent; border-top-color: var(--accent); z-index: 2; pointer-events: none; }
.f-ruler { --colw: min(252px, 72vw); position: relative; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; padding: 2px calc(50% - var(--colw) / 2) 12px; align-items: flex-start; }
.f-ruler::-webkit-scrollbar { display: none; }
.f-col { flex: 0 0 var(--colw); box-sizing: border-box; scroll-snap-align: center; display: grid; gap: 8px; align-content: start; padding-inline: 5px; }
.f-tick { display: grid; justify-items: center; border: 0; padding: 16px 0 4px; margin-inline: -5px; color: var(--fg); cursor: pointer;
  background: linear-gradient(var(--muted), var(--muted)) center top / 2px 12px no-repeat, repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 21px) left top / 100% 6px no-repeat, linear-gradient(var(--line), var(--line)) left top / 100% 1px no-repeat; }
.f-tick b { font-family: var(--font-mono); font-size: 18px; font-weight: 600; line-height: 1.2; }
.f-tick small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.f-tick:hover:not(:disabled) b { color: var(--accent); }
.f-tick:disabled { cursor: default; }
.f-col.center .f-tick { color: var(--accent); background: linear-gradient(var(--accent), var(--accent)) center top / 3px 16px no-repeat, repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 21px) left top / 100% 6px no-repeat, linear-gradient(var(--line), var(--line)) left top / 100% 1px no-repeat; }
.f-col.center .f-tick b { font-size: 22px; }
.f-col.center .f-tick small { color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.f-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.f-card { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 10px; min-width: 0; }
.f-card.exact { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.f-card.on { box-shadow: inset 3px 0 0 var(--accent), var(--frame-shadow); }
.f-nm { font-weight: 600; font-size: 14.5px; line-height: 1.3; overflow-wrap: anywhere; }
.f-stopline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; }
.f-stop { font-family: var(--font-mono); font-size: 17px; font-weight: 600; line-height: 1.2; }
.f-stop.hit { color: var(--ok); }
.f-stop.hit::before { content: "✓ "; font-size: 14px; }
.f-gap { font-size: 12.5px; color: var(--muted); }
.f-gap.hit { color: var(--ok); }
.f-meta { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.f-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; min-height: 32px; }
.f-foot .ctl { margin-inline-start: auto; }
.f-foot .ext { margin: 0 0 0 -4px; }
.f-more { border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 8px; color: var(--accent); font-size: 13px; }
.f-none { margin: 0; padding: 16px 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; text-align: center; }
/* frames: every boxed area is lighter than the page and lifted slightly off it */
.sub, .fav-list, .lines, .items.direct, .prod-card, .rule, .f-form, .f-card, .empty-state, .search, .house-opt, .editor { box-shadow: var(--frame-shadow); }
details.sub.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
details.sub.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
/* item names: a little smaller, kept on one line where they fit, broken only between whole pieces */
.item .nm, .line .nm { font-size: 13.5px; }
.u { display: inline-block; }
.nm-btn:hover .u { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.f-nm { font-size: 13.5px; }
/* a lens set on one flowing line, each lens with its stop */
.lens-line { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 1px; }
.ll { white-space: nowrap; font-family: var(--font-mono); font-size: 11.5px; }
.ll b { font-weight: 600; color: var(--fg); }
.ll.on { background: var(--tint); box-shadow: 0 0 0 2px var(--tint); border-radius: 3px; color: var(--ink); }
.ll.on b { color: var(--ink); }
.lens-line .sep { color: var(--muted); opacity: .55; }
.ext svg { display: block; }
/* production details under the title */
.prod-facts { margin: 4px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--frame-shadow); }
.prod-facts > div { min-width: 0; }
.prod-facts dt { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.prod-facts dd { margin: 2px 0 0; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.prod-facts dd small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); font-family: var(--font-mono); margin-top: 1px; }
.prod-facts .pf-add { grid-column: 1 / -1; margin: -2px 0 -4px -8px; }
/* account line (standalone app) */
.acct { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--frame-shadow); }

/* a lens's name without what its spec line already says (mount, stop, format, squeeze, the set's focal list),

       .replace(/\bfor Sony E\b/gi, " ").replace(/\bLens-LPL\b/gi, "Lens").replace(/\sPL(?=\s+(?:Set|Kit)\b)/g, " ")
       .replace(/\s-\s*\d+(?:\.\d+)?(?:\s*,\s*\d+(?:\.\d+)?)+\s*mm\s*\/?\s*(?:All\b)?/gi, " ");                  // "- 18, 25, 35mm/ All"

       .replace(/\s\bT\s?\/?\s?\d+(?:\.\d+)?(?:\s*[-–/]\s*T?\d+(?:\.\d+)?)*(?=[\s,)]|$)/g, " ")
       .replace(/\s\bf\s?\/\s?\d+(?:\.\d+)?(?:\s*[-–]\s*\d+(?:\.\d+)?)?(?=[\s,)]|$)/gi, " ")

/* quantity changes */
function setQty(p, id, qty, field) {
  qty = clampQ(qty);
  const wasNew = !p.items[id];
  let l = p.items[id];
  if (!l) {
    if (qty === 0 || !ITEM.has(id)) return [];
    l = p.items[id] = lineFromCatalog(id);
    if (l.tx !== undefined) { l.sets = qty; l.tx = qty; l.rx = qty; }
    else l.qty = qty;
  } else if (field && l.tx !== undefined) {
    l[field] = qty;  // TX and RX are counted on their own; the sets stay as they are
  } else if (l.tx !== undefined) {  // another set (or one less) brings one TX and one RX with it
    const d = qty - lineQty(l);
    l.sets = qty; l.tx = Math.max(0, (l.tx || 0) + d); l.rx = Math.max(0, (l.rx || 0) + d);
    if (qty === 0) delete p.items[id];
  } else {
    l.qty = qty;
    if (qty === 0) delete p.items[id];
  }
  if (p.items[id]) p.items[id].qty = lineQty(p.items[id]);
  const changed = [id];
  changed.push(...applyDefaults(p));
  const adds = lastAutoAdds;
  touch(p);
  const cov = wasNew && p.items[id] ? coverageAlert(p, id) : "";
  if (cov) {
    const e = ITEM.get(id);
    showModal(cov + `<div class="modal-actions"><button class="btn" type="button" data-act="modal-undo" data-id="${esc(id)}">Remove ${esc(shortName(e.it.name))}</button><button class="btn primary" type="button" data-act="modal-close">Keep it</button></div>`);
  }
  delete p._w;
  notifyDefaults(adds);
  // an ARRI hand unit (Hi-5, WCU-4) needs motors: ask which ones
  if (wasNew && p.items[id] && !cov && MOTOR_HOST.test(ITEM.get(id)?.it.name || "")) motorPicker(p, id);

function selCount(p, pred) { let n = 0; for (const id of Object.keys(p.items)) { const e = ITEM.get(id); if (e && pred(e)) n++; } return n; }
function selBadge(n, key) { return `<span class="sel" data-sel="${esc(key)}" ${n ? "" : "hidden"}>${n}</span>`; }

const grpOf = (it, s) => { const g = it.grp || naturalGroup(it, s); return g === NOFOLDER ? "" : g; };
/* the user's dragged order of groups wins; the rest keep the default order after them */
function userOrder(arr, order, key) {
  if (!order || !order.length) return arr;
  const at = v => { const i = order.indexOf(key(v)); return i < 0 ? 1e6 : i; };
  return arr.map((v, n) => [v, n]).sort((a, b) => at(a[0]) - at(b[0]) || a[1] - b[1]).map(a => a[0]);

  else out = [...m.entries()].sort((a, b) => a[0] === "Generic" ? 1 : b[0] === "Generic" ? -1 : a[0].localeCompare(b[0], "en", { sensitivity: "base" }));

const hay = (it, s) => norm(it.name + " " + (it.sku || "") + " " + noteOf(it.id) + " " + it.brand + " " + (it.group || "") + " " + s.name + " " + (it.site_name || "") + " " + (it.lens ? (it.lens.focals || "") + " " + (it.lens.coverage || "") : ""));

          (its.length ? (splitByBrand(h, s, b) ? brandRows(its, (it, br) => ed ? editRowHtml(it, kB, q, br) : rowHtml(p, it, q), ed, kB, null, kB, (peekEdits(h.id).brandOrder || {})[kB], searching) : its.map(it => ed ? editRowHtml(it, kB, q) : rowHtml(p, it, q)).join("")) : `<li class="drop-empty"${dz(kB)}>Empty folder. Drag items here.</li>`) + addHere + `</ul></details>`;

/* an item typed into the Cam list: is it already in the house's catalog, and if not, where would it go?

const GUESS_STOP = new Set(["the", "and", "for", "with", "set", "kit", "mm", "inch", "pro", "mini", "new", "black", "of", "to", "x"]);
const words = s => norm(s).replace(/[^a-z0-9.]+/g, " ").split(" ").filter(w => w.length >= 2 && !GUESS_STOP.has(w));
function catalogGuess(h, name, sec) {
  const n = flat(name), all = [...ITEM.values()].filter(e => e.h === h);
  const exact = all.find(e => flat(e.it.name) === n);
  if (exact) return { match: exact.it.id };
  if (n.length >= 5) { const inc = all.filter(e => flat(e.it.name).includes(n)); if (inc.length === 1) return { match: inc[0].it.id }; }
  const pool = all.filter(e => e.it.section === sec);
  if (!pool.length) return { none: true };
  const df = new Map();
  for (const e of all) for (const w of new Set(words(e.it.name))) df.set(w, (df.get(w) || 0) + 1);
  const ws = [...new Set(words(name))];
  const brands = new Map(all.map(e => [norm(e.it.brand), e.it.brand]));
  const brand = ws.map(w => brands.get(w)).find(b => b && b !== "Generic") || "";
  const hits = new Map(), best = new Map();
  for (const e of pool) {
    const iw = new Set(words(e.it.name + " " + e.s.name)); let sc = 0;
    for (const w of ws) if (iw.has(w) && norm(e.it.brand) !== w) sc += 1 / Math.log2(1.5 + (df.get(w) || 1));
    if (!sc) continue;
    hits.set(e.s, (hits.get(e.s) || 0) + 1);
    if (!best.has(e.s) || sc > best.get(e.s).sc) best.set(e.s, { sc, e });
  }
  const subs = [...new Set(pool.map(e => e.s))];
  // the closest single item counts most; a few more alike in the same subcategory tip the balance
  const ranked = [...best.entries()].map(([s, b]) => [s, b.sc + 0.1 * Math.min(5, hits.get(s))]).sort((a, b) => b[1] - a[1]);
  let sub = ranked.length ? ranked[0][0] : null, sure = false;
  if (subs.length === 1) { sub = subs[0]; sure = true; }
  else if (ranked.length) sure = best.get(sub).sc >= 0.9 && (ranked.length === 1 || ranked[0][1] >= ranked[1][1] * 1.4);
  if (!sub) sub = subs.sort((a, b) => pool.filter(e => e.s === b).length - pool.filter(e => e.s === a).length)[0];
  const like = best.has(sub) ? best.get(sub).e : null;
  const group = sub.groupBy && like ? grpOf(like.it, like.s) : undefined;
  return { sub, sure, brand, group };
}

  else Object.assign(app.settings, { catalog: clone(STARTER.catalog), closedBrands: clone(STARTER.closedBrands), catColors: clone(STARTER.catColors) });  // first open: the starting catalog
  if (!app.settings.mediaSeeded) { app.settings.mediaSeeded = true; lsPut(LS_SET, app.settings); }
  applyCatalog();
  const ui = lsGet(LS_UI, {});
  if (ui.view === "production" && app.productions.some(p => p.id === ui.pid)) { app.view = "production"; app.pid = ui.pid; app.tab = ["add", "fav", "list"].includes(ui.tab) ? ui.tab : "add"; }
  else if (ui.view === "settings") app.view = "settings";
}
render();
initAccount();
</script>
