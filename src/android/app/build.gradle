plugins { id "com.android.application" }
android {
    namespace "com.ofirkarl.accamlist.send"
    compileSdk 34
    defaultConfig {
        applicationId "com.ofirkarl.accamlist.send"
        minSdk 26
        targetSdk 34
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        versionName "1." + (System.getenv("VERSION_CODE") ?: "1")
    }
    // signed with the app's own key when the build has it (repo secrets); otherwise the build signs it with a debug key
    if (System.getenv("KEYSTORE_PASS")) {
        signingConfigs {
            release {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASS")
                keyAlias "send"
                keyPassword System.getenv("KEYSTORE_PASS")
            }
        }
        buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
